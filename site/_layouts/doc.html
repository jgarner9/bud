<!doctype html>
<html lang="en">
<head>
{% include head.html %}
<script>document.documentElement.className = "js"; // the phone menu is a drawer only when its script can open it</script>
</head>
<body class="doc">
<header class="bar">
  <button class="toggle" id="toggle" type="button" aria-expanded="false" aria-controls="side" aria-label="Docs menu"><span></span></button>
  <a class="brand" href="{{ '/' | relative_url }}"><span class="face">[o.o]</span> bud</a>
  <nav>
    <a href="{{ '/docs/setup.html' | relative_url }}">Docs</a>
    <a href="{{ site.repo }}">GitHub</a>
  </nav>
</header>
<div class="shell">
  <aside class="side" id="side">
    <nav aria-label="Docs">
    {% for group in site.data.nav %}
    <p class="group">{{ group.title }}</p>
    <ul>
      {% for p in group.pages %}
      {% capture href %}/docs/{{ p.file }}.html{% endcapture %}
      <li><a href="{{ href | relative_url }}"{% if page.url == href %} aria-current="page"{% endif %}>{{ p.title }}</a></li>
      {% endfor %}
    </ul>
    {% endfor %}
    </nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="prose">
    <h1>{{ page.title }}</h1>
    {{ content }}
    <p class="edit"><a href="{{ site.repo }}/blob/main/{{ page.path }}">This page on GitHub</a></p>
  </main>
</div>
<script>
// on a phone the sidebar is a drawer: the header's button slides it in, and
// the button again, the page behind it or Escape closes it
(function () {
  var root = document.documentElement;
  var toggle = document.getElementById("toggle");
  function set(open) {
    root.classList.toggle("menu-open", open);
    toggle.setAttribute("aria-expanded", open);
  }
  toggle.addEventListener("click", function () {
    set(!root.classList.contains("menu-open"));
  });
  document.getElementById("scrim").addEventListener("click", function () {
    set(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && root.classList.contains("menu-open")) {
      set(false);
      toggle.focus();
    }
  });
  // a link to this page's own heading doesn't reload, so close for it too
  document.getElementById("side").addEventListener("click", function (e) {
    if (e.target.closest("a")) set(false);
  });
})();
</script>
<script type="module">
// ```mermaid blocks (docs/architecture.md) are drawn in the browser, so the
// Markdown stays the one source that GitHub draws too. Mermaid loads only on
// a page that has one. Kramdown wraps a fenced block in a .language-mermaid
// div (or puts the class on the code), and the text inside is the source.
const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
if (blocks.length) {
  for (const block of blocks) {
    const box = block.tagName === "CODE" ? block.parentElement : block;
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = block.textContent;
    box.replaceWith(pre);
  }
  const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs");
  const css = getComputedStyle(document.documentElement);
  const v = (name) => css.getPropertyValue(name).trim();
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "strict",
    theme: "base",
    fontFamily: v("--sans"),
    themeVariables: {
      background: v("--base"),
      primaryColor: v("--surface"),
      primaryTextColor: v("--text"),
      primaryBorderColor: v("--blue"),
      secondaryColor: v("--mantle"),
      tertiaryColor: v("--mantle"),
      clusterBkg: v("--mantle"),
      clusterBorder: v("--line"),
      lineColor: v("--dim"),
      textColor: v("--text"),
      edgeLabelBackground: v("--base"),
      actorBkg: v("--surface"),
      actorBorder: v("--blue"),
      actorTextColor: v("--text"),
      signalColor: v("--dim"),
      signalTextColor: v("--text"),
      noteBkgColor: v("--mantle"),
      noteTextColor: v("--text"),
    },
  });
  await mermaid.run({ querySelector: "pre.mermaid" });
}
</script>
</body>
</html>
