name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh scripts/*.sh
      - run: sh scripts/install-test.sh
      - run: sh scripts/release_plan_test.sh
      - run: sh scripts/content_release_test.sh

  # Suite D21, D59: nothing personal in this public repo. The shape checks
  # always run; your own strings come from the BUD_LEAK_PATTERNS secret (one
  # regex per line), which forks' PRs don't get, so they run shapes only
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh scripts/leak_check_test.sh
      - run: sh scripts/leak-check.sh
        env:
          BUD_LEAK_PATTERNS: ${{ secrets.BUD_LEAK_PATTERNS }}

  lua:
    runs-on: ubuntu-latest
    env:
      STYLUA_VERSION: v2.6.0
      SELENE_VERSION: 0.32.0
    steps:
      - uses: actions/checkout@v5
      - name: install stylua and selene
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/stylua.zip" "https://github.com/JohnnyMorganz/StyLua/releases/download/$STYLUA_VERSION/stylua-linux-x86_64.zip"
          # selene-light leaves out the Roblox standard library, which needs OpenSSL
          curl -fsSL -o "$RUNNER_TEMP/selene.zip" "https://github.com/Kampfkarren/selene/releases/download/$SELENE_VERSION/selene-light-$SELENE_VERSION-linux.zip"
          unzip -o "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/bin"
          unzip -o "$RUNNER_TEMP/selene.zip" -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/stylua" "$RUNNER_TEMP/bin/selene"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: stylua --check ide/nvim scripts ide/tests ide/languages ide/layouts ide/migrations ide/tools
      - run: selene ide/nvim scripts ide/tests ide/languages ide/layouts ide/migrations ide/tools

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest Neovim bud supports (D19) and the newest
        nvim: [v0.12.0, v0.12.6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install neovim ${{ matrix.nvim }}
        run: |
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${{ matrix.nvim }}/nvim-linux-x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: lua tests
        run: sh scripts/lua-test.sh
      # the go job has no nvim, so the tests that read specs through it skip there
      - name: go tests that need nvim
        run: go test ./internal/lang
      - run: sh scripts/smoke.sh

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
