# Written by bud sync from the model registry and env fragments. Edits here are
# replaced on the next sync: change content/env or your overlay's env instead.
_config_version: 53
approvals:
  approvers: []
  cron_mode: "deny"
  deny:
    - "op"
    - "op *"
  mode: "manual"
  single_query_mode: "deny"
  timeout: 3600
  unattended_mode: "deny"
auxiliary:
  background_review:
    enabled: false
command_allowlist: []
curator:
  consolidate: false
fallback_providers: []
hooks:
  pre_tool_call:
    - command: "bud hermes-gate /home/you/state/bud/hermes-tiers.json"
      fail_closed: true
      timeout: 10
hooks_auto_accept: true
mcp_servers:
  calendar:
    headers:
      X-Bud-Privacy: "P1"
    trust: "untrusted"
    url: "http://100.64.0.1:8790/calendar/mcp"
  context7:
    url: "https://mcp.context7.com/mcp"
  github:
    headers:
      Authorization: "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"
    trust: "untrusted"
    url: "https://api.githubcopilot.com/mcp/"
  linear:
    headers:
      X-Bud-Privacy: "P1"
    trust: "untrusted"
    url: "http://100.64.0.1:8790/linear/mcp"
  memory:
    url: "http://100.64.0.1:8791/mcp"
  ops:
    url: "http://127.0.0.1:8792/mcp"
memory:
  write_approval: true
model:
  default: "qwen-35b"
  provider: "custom:qwen"
platform_toolsets:
  api_server:
    - "terminal"
    - "file"
    - "code_execution"
    - "web"
    - "browser"
    - "memory"
    - "session_search"
    - "skills"
    - "cronjob"
