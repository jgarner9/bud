name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the changelog
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # D7, D41: signs checksums.txt once the release key exists. Off until
      # the BUD_RELEASE_KEY secret is set; sign-release.sh fails the release if
      # that key doesn't match the public key pinned in install.sh
      - name: Is the release key set?
        id: key
        run: echo "set=${{ secrets.BUD_RELEASE_KEY != '' }}" >>"$GITHUB_OUTPUT"
      - name: Sign checksums.txt
        if: steps.key.outputs.set == 'true'
        env:
          BUD_RELEASE_KEY: ${{ secrets.BUD_RELEASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/sign-release.sh dist/checksums.txt
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sig
