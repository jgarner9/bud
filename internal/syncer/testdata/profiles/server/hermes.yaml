mcp_servers:
  calendar:
    headers:
      X-Bud-Privacy: "P1"
    trust: "untrusted"
    url: "http://100.64.0.1:8790/calendar/mcp"
  context7:
    url: "https://mcp.context7.com/mcp"
  github:
    args:
      - "stdio"
    command: "github-mcp-server"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
    trust: "untrusted"
  linear:
    headers:
      X-Bud-Privacy: "P1"
    trust: "untrusted"
    url: "http://100.64.0.1:8790/linear/mcp"
  memory:
    url: "http://100.64.0.1:8791/mcp"
