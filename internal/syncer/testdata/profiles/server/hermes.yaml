    - "memory"
    - "session_search"
    - "skills"
    - "cronjob"
    - "delegation"
    - "todo"
    - "clarify"
    - "vision"
  cron:
    - "terminal"
    - "file"
    - "code_execution"
    - "web"
    - "browser"
    - "memory"
    - "session_search"
    - "skills"
    - "cronjob"
    - "delegation"
    - "todo"
    - "vision"
  signal:
    - "terminal"
    - "file"
    - "code_execution"
    - "web"
    - "browser"
    - "memory"
    - "session_search"
    - "skills"
    - "cronjob"
    - "delegation"
    - "todo"
    - "clarify"
    - "vision"
platforms:
