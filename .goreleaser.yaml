# Builds bud for linux/darwin × amd64/arm64 and attaches the archives to a GitHub release.
# Archive names carry no version, so install.sh can fetch releases/latest/download/<name> directly.
version: 2

project_name: bud

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bud
    main: ./cmd/bud
    binary: bud
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X jgarner.dev/bud/internal/version.Version={{ .Version }}

archives:
  - id: bud
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

# the nightly workflow names its builds (X.Y.Z-nightly.YYYYMMDDHHMM, D42);
# other snapshots (CI's goreleaser check) get GoReleaser's usual name
snapshot:
  version_template: '{{ if isEnvSet "NIGHTLY_VERSION" }}{{ .Env.NIGHTLY_VERSION }}{{ else }}{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

git:
  # the rolling nightly tag (nightly.yml) is never a release: without this,
  # a release cut after a nightly build lists only the commits since it
  ignore_tags:
    - nightly

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: jgarner9
    name: bud
