    - "bud-signal"
providers:
  classify:
    api: "http://home.invalid:8083/v1"
    models:
      gemma-4-e4b:
        context_length: 32768
    transport: "chat_completions"
  go:
    api: "https://opencode.ai/inference/go/openai/v1"
    key_env: "OPENCODE_GO_API_KEY"
    models:
      gemini-4-argon:
        context_length: 1048576
      "glm-5.2":
